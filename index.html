<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet">
    <title>Portal_Page</title>
</head>
<body>
    <div id="content">
        <header>
            <a id="portal_logo" href="index.html">
                <img class="logo" src="images/portal_logo.jpg" alt="Portal Logo">
            </a>
            <nav>
                <a href="index.html">Home</a>
                <a href="#">Projects</a>
                <a href="contactus.html">Contact me</a>
            </nav>
        </header>
        <div id="hero">
            <div id="hero-box">
                <img id="hero-img" src="images/hero_image.jpg" alt="People enjoing rafting">
            </div>
            <section id="hero-msg">
                <h1 class="button-box">View Splash Point</h1>
                <div class="button-box">
                    <a class="view" target="_blank" href="wwr/index.html">Take a Splash</a>
                </div>
            </section>
        </div>
        <main class="home-grid">
            <section class="ice_projects">
                <img class="img-card" src="images/ice_card.jpg" alt="Ice cubes">
                <h1>Ice Projects</h1>
            </section>
            <section class="other_projects">
                <img class="img-card" src="images/blueprint_card.jpg" alt="Blue Print">
                <h1>Other Projects</h1>
            </section>
        </main>
        <footer>
            <a target="_blank" href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon">
            </a>
            <a target="_blank" href="https://twitter.com">
                <img src="images/twitter.png" alt="Twitter Icon">
            </a>
            <a target="_blank" href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram Icon">
            </a>
            <p>Protal Page&copy; 2026 - Logan Cole</p>
        </footer>
    </div>

</html>
